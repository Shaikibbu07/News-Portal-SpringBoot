<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV7ibbu — News Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:    #0d0d0d;
            --paper:  #faf8f4;
            --accent: #c0392b;
            --muted:  #6b6b6b;
            --border: #e0ddd6;
            --card-bg:#ffffff;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Source Sans 3', sans-serif;
            background: var(--paper);
            color: var(--ink);
            font-size: 16px;
        }

        /* ── TOP STRIP ─────────────────────────────────────────────────────────── */
        .topstrip {
            background: var(--ink);
            color: #aaa;
            font-size: 12px;
            padding: 6px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: .5px;
        }
        .topstrip a { color: #aaa; text-decoration: none; }
        .topstrip a:hover { color: white; }

        /* ── MASTHEAD ───────────────────────────────────────────────────────────── */
        .masthead {
            text-align: center;
            padding: 24px 40px 16px;
            border-bottom: 3px double var(--ink);
            position: relative;
        }
        .masthead h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(40px, 7vw, 72px);
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1;
        }
        .masthead .tagline {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 4px;
        }
        .masthead .date {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: var(--muted);
            text-align: right;
            line-height: 1.6;
        }

        /* ── NAVBAR ─────────────────────────────────────────────────────────────── */
        .navbar {
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            display: flex;
            gap: 0;
            align-items: center;
            background: var(--card-bg);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
        }
        .navbar a {
            color: var(--ink);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .5px;
            text-transform: uppercase;
            padding: 14px 18px;
            border-bottom: 3px solid transparent;
            transition: border-color .2s, color .2s;
        }
        .navbar a:hover, .navbar a.active {
            border-bottom-color: var(--accent);
            color: var(--accent);
        }

        /* ── SEARCH BAR ─────────────────────────────────────────────────────────── */
        .search-wrap {
            background: var(--ink);
            padding: 18px 40px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .search-wrap input {
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.2);
            color: white;
            padding: 10px 16px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            width: 200px;
            outline: none;
            transition: border-color .2s;
        }
        .search-wrap input::placeholder { color: rgba(255,255,255,.4); }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-wrap button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .2s;
            letter-spacing: .5px;
        }
        .search-wrap button:hover { opacity: .85; }

        /* ── BREAKING TICKER ────────────────────────────────────────────────────── */
        .ticker {
            background: var(--accent);
            color: white;
            padding: 8px 40px;
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 13px;
            overflow: hidden;
        }
        .ticker-label {
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
            padding-right: 16px;
            border-right: 1px solid rgba(255,255,255,.4);
        }
        .ticker-text { white-space: nowrap; animation: ticker 20s linear infinite; }
        @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* ── MAIN LAYOUT ────────────────────────────────────────────────────────── */
        .layout {
            max-width: 1280px;
            margin: 0 auto;
            padding: 30px 40px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 40px;
        }

        /* ── HERO SECTION ───────────────────────────────────────────────────────── */
        .hero-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto auto;
            gap: 16px;
            margin-bottom: 40px;
        }

        .hero-main {
            grid-row: 1 / 3;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
        }
        .hero-main img {
            width: 100%;
            height: 480px;
            object-fit: cover;
            display: block;
            transition: transform .4s ease;
        }
        .hero-main:hover img { transform: scale(1.03); }
        .hero-main .overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 30px 24px 24px;
            background: linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 100%);
            color: white;
        }
        .hero-main .cat-badge {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 8px;
        }
        .hero-main h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(20px, 2.5vw, 30px);
            line-height: 1.25;
            font-weight: 700;
        }
        .hero-main .meta { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 8px; }

        /* side small cards */
        .hero-side {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
        }
        .hero-side img {
            width: 100%;
            height: 232px;
            object-fit: cover;
            display: block;
            transition: transform .4s ease;
        }
        .hero-side:hover img { transform: scale(1.04); }
        .hero-side .overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 16px 16px;
            background: linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 100%);
            color: white;
        }
        .hero-side .cat-badge {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .hero-side h4 {
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            line-height: 1.3;
        }

        /* ── SECTION DIVIDER ────────────────────────────────────────────────────── */
        .section-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 32px 0 20px;
        }
        .section-head h3 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            white-space: nowrap;
        }
        .section-head::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .section-head .bar {
            width: 4px; height: 22px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* ── LIST CARDS ─────────────────────────────────────────────────────────── */
        .news-list { display: flex; flex-direction: column; gap: 16px; }

        .news-card {
            display: flex;
            gap: 16px;
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: box-shadow .2s, transform .2s;
            text-decoration: none;
            color: inherit;
        }
        .news-card:hover {
            box-shadow: 0 6px 24px rgba(0,0,0,.1);
            transform: translateY(-2px);
        }
        .news-card img {
            width: 140px;
            min-width: 140px;
            height: 100px;
            object-fit: cover;
        }
        .news-card .info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .news-card .cat {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
        }
        .news-card h4 {
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            line-height: 1.35;
            margin: 4px 0;
        }
        .news-card .meta { font-size: 11px; color: var(--muted); }

        /* ── SIDEBAR ────────────────────────────────────────────────────────────── */
        .sidebar { }
        .sidebar-section { margin-bottom: 32px; }
        .sidebar-section .section-head { margin-top: 0; }

        .sidebar-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
        }
        .sidebar-item:last-child { border-bottom: none; }
        .sidebar-item img {
            width: 72px;
            height: 56px;
            object-fit: cover;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .sidebar-item h5 {
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            line-height: 1.35;
            transition: color .2s;
        }
        .sidebar-item:hover h5 { color: var(--accent); }
        .sidebar-item .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }

        /* ad placeholder */
        .ad-box {
            background: var(--border);
            border-radius: 6px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        /* ── EMPTY STATE ────────────────────────────────────────────────────────── */
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }
        .empty span { font-size: 48px; display: block; margin-bottom: 16px; }
        .empty h3 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--ink); }

        /* ── FOOTER ─────────────────────────────────────────────────────────────── */
        footer {
            background: var(--ink);
            color: #888;
            text-align: center;
            padding: 24px;
            font-size: 13px;
            margin-top: 40px;
        }
        footer strong { color: white; font-family: 'Playfair Display', serif; }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; padding: 20px; }
            .hero-grid { grid-template-columns: 1fr; }
            .hero-main { grid-row: auto; }
            .hero-main img { height: 280px; }
            .masthead .date { display: none; }
        }
    </style>
</head>
<body>

<!-- TOP STRIP -->
<div class="topstrip">
    <span id="live-date"></span>
    <div><a href="#">About</a> &nbsp;·&nbsp; <a href="#">Contact</a> &nbsp;·&nbsp; <a href="#">Subscribe</a></div>
</div>

<!-- MASTHEAD -->
<div class="masthead">
    <h1>TV7ibbu</h1>
    <p class="tagline">Truth · Clarity · Impact</p>
    <div class="date" id="masthead-date"></div>
</div>

<!-- NAVBAR -->
<nav class="navbar">
    <a href="/" class="active">Home</a>
    <a th:href="@{/category/Tech}">Tech</a>
    <a th:href="@{/category/Sports}">Sports</a>
    <a th:href="@{/category/Lifestyle}">Lifestyle</a>
    <a th:href="@{/category/World}">World</a>
    <a th:href="@{/category/Business}">Business</a>
</nav>

<!-- SEARCH -->
<div class="search-wrap">
    <form action="/search" method="get" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
        <input type="text" name="keyword"  placeholder="Search articles…">
        <input type="text" name="category" placeholder="Category">
        <input type="text" name="region"   placeholder="Region">
        <button type="submit">Search</button>
    </form>
</div>

<!-- BREAKING TICKER -->
<div class="ticker" th:if="${newsList != null and !#lists.isEmpty(newsList)}">
    <span class="ticker-label">Breaking</span>
    <span class="ticker-text">
    <th:block th:each="n : ${newsList}">
      ● <span th:text="${n.safeTitle}"></span> &nbsp;&nbsp;&nbsp;
    </th:block>
        <!-- duplicate for seamless loop -->
    <th:block th:each="n : ${newsList}">
      ● <span th:text="${n.safeTitle}"></span> &nbsp;&nbsp;&nbsp;
    </th:block>
  </span>
</div>

<!-- MAIN LAYOUT -->
<div class="layout">

    <!-- LEFT: CONTENT -->
    <main>

        <!-- EMPTY STATE -->
        <div class="empty" th:if="${newsList == null or #lists.isEmpty(newsList)}">
            <span>📭</span>
            <h3>No stories available right now.</h3>
            <p style="margin-top:8px;">Check back soon or try a search above.</p>
        </div>

        <!-- HERO GRID -->
        <div class="hero-grid" th:if="${newsList != null and !#lists.isEmpty(newsList)}">

            <!-- FEATURED (first article) -->
            <a th:href="@{/article/{id}(id=${newsList[0].id})}" class="hero-main">
                <img th:src="${newsList[0].imageUrl != null ? newsList[0].imageUrl : '/images/placeholder.png'}"
                     alt="featured">
                <div class="overlay">
                    <div class="cat-badge" th:text="${newsList[0].category != null ? newsList[0].category : 'News'}"></div>
                    <h2 th:text="${newsList[0].safeTitle}"></h2>
                    <div class="meta">
                        <span th:text="${newsList[0].author != null ? '✍ ' + newsList[0].author : ''}"></span>
                        &nbsp;·&nbsp;
                        <span th:text="${newsList[0].publishedDate != null ? newsList[0].publishedDate : ''}"></span>
                    </div>
                </div>
            </a>

            <!-- SIDE CARDS (articles 2 & 3) -->
            <th:block th:each="n,iter : ${newsList}" th:if="${iter.index == 1 or iter.index == 2}">
                <a th:href="@{/article/{id}(id=${n.id})}" class="hero-side">
                    <img th:src="${n.imageUrl != null ? n.imageUrl : '/images/placeholder.png'}" alt="news">
                    <div class="overlay">
                        <div class="cat-badge" th:text="${n.category != null ? n.category : 'News'}"></div>
                        <h4 th:text="${n.safeTitle}"></h4>
                    </div>
                </a>
            </th:block>

        </div>

        <!-- MORE STORIES -->
        <div th:if="${newsList != null and newsList.size() > 3}">
            <div class="section-head">
                <div class="bar"></div>
                <h3>More Stories</h3>
            </div>
            <div class="news-list">
                <th:block th:each="n,iter : ${newsList}" th:if="${iter.index >= 3}">
                    <a th:href="@{/article/{id}(id=${n.id})}" class="news-card">
                        <img th:src="${n.imageUrl != null ? n.imageUrl : '/images/placeholder.png'}" alt="news">
                        <div class="info">
                            <div class="cat" th:text="${n.category != null ? n.category : 'News'}"></div>
                            <h4 th:text="${n.safeTitle}"></h4>
                            <div class="meta">
                                <span th:text="${n.author != null ? n.author : 'Staff'}"></span>
                                &nbsp;·&nbsp;
                                <span th:text="${n.publishedDate != null ? n.publishedDate : ''}"></span>
                            </div>
                        </div>
                    </a>
                </th:block>
            </div>
        </div>

    </main>

    <!-- RIGHT: SIDEBAR -->
    <aside class="sidebar">

        <!-- AD -->
        <div class="ad-box">Advertisement</div>

        <!-- TECH -->
        <div class="sidebar-section" th:if="${techNews != null and !#lists.isEmpty(techNews)}">
            <div class="section-head">
                <div class="bar"></div>
                <h3>Tech</h3>
            </div>
            <th:block th:each="n,iter : ${techNews}" th:if="${iter.index < 4}">
                <a th:href="@{/article/{id}(id=${n.id})}" class="sidebar-item">
                    <img th:src="${n.imageUrl != null ? n.imageUrl : '/images/placeholder.png'}" alt="">
                    <div>
                        <h5 th:text="${n.safeTitle}"></h5>
                        <div class="meta" th:text="${n.publishedDate != null ? n.publishedDate : ''}"></div>
                    </div>
                </a>
            </th:block>
        </div>

        <!-- SPORTS -->
        <div class="sidebar-section" th:if="${sportsNews != null and !#lists.isEmpty(sportsNews)}">
            <div class="section-head">
                <div class="bar"></div>
                <h3>Sports</h3>
            </div>
            <th:block th:each="n,iter : ${sportsNews}" th:if="${iter.index < 4}">
                <a th:href="@{/article/{id}(id=${n.id})}" class="sidebar-item">
                    <img th:src="${n.imageUrl != null ? n.imageUrl : '/images/placeholder.png'}" alt="">
                    <div>
                        <h5 th:text="${n.safeTitle}"></h5>
                        <div class="meta" th:text="${n.publishedDate != null ? n.publishedDate : ''}"></div>
                    </div>
                </a>
            </th:block>
        </div>

    </aside>
</div>

<!-- FOOTER -->
<footer>
    <strong>TV7ibbu</strong> &nbsp;·&nbsp; © <span id="yr"></span> All rights reserved.
</footer>

<script>
    // Live date
    const now = new Date();
    const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
    const dateStr = now.toLocaleDateString('en-US', opts);
    document.getElementById('live-date').textContent = dateStr;
    document.getElementById('masthead-date').innerHTML =
        now.toLocaleDateString('en-US',{weekday:'long'}) + '<br>' +
        now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    document.getElementById('yr').textContent = now.getFullYear();

    // Navbar active on scroll (optional enhancement)
    const links = document.querySelectorAll('.navbar a');
    links.forEach(l => {
        if (l.getAttribute('href') === window.location.pathname) l.classList.add('active');
    });
</script>
</body>
</html>
